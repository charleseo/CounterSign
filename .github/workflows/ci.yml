name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Type-Check (TypeScript Strict)
        run: npx tsc --noEmit

      - name: Lint Code & Accessibility
        run: npm run lint

      - name: Build Application & Enforce Budget
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
