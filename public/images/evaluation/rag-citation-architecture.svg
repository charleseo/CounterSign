<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Dark slate gradient -->
    <linearGradient id="evalBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Emerald Flow -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="evalCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot grid -->
    <pattern id="evalDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#374151" opacity="0.35" />
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="16" fill="url(#evalBgGrad)" />
  <rect width="1200" height="500" rx="16" fill="url(#evalDots)" />

  <!-- PIPELINE STAGES -->

  <!-- STAGE 1: CLIENT TECH DOCS & CODEBASE -->
  <g transform="translate(60, 110)">
    <rect width="210" height="280" rx="14" fill="url(#evalCardGrad)" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="38" rx="14" fill="#1A2234" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#9CA3AF">01 DOCS INGESTION</text>
    
    <g transform="translate(16, 56)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">API Specifications</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">OpenAPI 3.1 / Markdown</text>
    </g>

    <g transform="translate(16, 108)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Migration Guides</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Breaking changes &amp; SDKs</text>
    </g>

    <g transform="translate(16, 160)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Version-Locked Rubric</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#10B981">Fixed audit rules</text>
    </g>

    <g transform="translate(16, 218)">
      <rect width="178" height="42" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
      <text x="12" y="25" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34D399">✓ 100-300 Test Pairs</text>
    </g>
  </g>

  <!-- WIRE 1 TO 2 -->
  <path d="M 270 250 L 330 250" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)" />

  <!-- STAGE 2: PRODUCTION RAG & LLM COMPLETIONS -->
  <g transform="translate(330, 110)">
    <rect width="210" height="280" rx="14" fill="url(#evalCardGrad)" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="38" rx="14" fill="#1A2234" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#38BDF8">02 MODEL EXECUTION</text>

    <g transform="translate(16, 56)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Developer Query</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Real user inquiries</text>
    </g>

    <g transform="translate(16, 108)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Retrieved Chunks</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Vector store Top-K</text>
    </g>

    <g transform="translate(16, 160)">
      <rect width="178" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="12" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Model Answer</text>
      <text x="12" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#F59E0B">Syntactic code + claims</text>
    </g>

    <g transform="translate(16, 218)">
      <rect width="178" height="42" rx="6" fill="#0C4A6E" fill-opacity="0.4" stroke="#38BDF8" stroke-width="1" />
      <text x="12" y="25" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38BDF8">Input/Output Capture</text>
    </g>
  </g>

  <!-- WIRE 2 TO 3 -->
  <path d="M 540 250 L 600 250" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)" />

  <!-- STAGE 3: TRACEBASE HUMAN AUDIT LAYER (THE CORE DIFFERENTIATOR) -->
  <g transform="translate(600, 70)">
    <rect width="280" height="360" rx="16" fill="url(#evalCardGrad)" stroke="#10B981" stroke-width="2" filter="url(#glow)" />
    <rect x="0" y="0" width="280" height="44" rx="16" fill="#064E3B" />
    <text x="20" y="28" font-family="ui-monospace, monospace" font-size="12" font-weight="800" fill="#34D399">03 HUMAN AUDIT LAYER</text>

    <g transform="translate(20, 60)">
      <rect width="240" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F3F4F6">Line-by-Line Citation Check</text>
      <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">Every citation matched to text</text>
    </g>

    <g transform="translate(20, 120)">
      <rect width="240" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F3F4F6">Hallucination Trap Scan</text>
      <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#F59E0B">Flags invented flags &amp; APIs</text>
    </g>

    <g transform="translate(20, 180)">
      <rect width="240" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F3F4F6">Negative-Constraint Check</text>
      <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#38BDF8">Ensures truthful refusal</text>
    </g>

    <g transform="translate(20, 240)">
      <rect width="240" height="50" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="14" y="22" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F3F4F6">Principal Evaluator Sign-off</text>
      <text x="14" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#10B981">Ebubechukwu Okeke verified</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="240" height="42" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
      <text x="120" y="26" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle">✓ ZERO LLM-AS-A-JUDGE BIAS</text>
    </g>
  </g>

  <!-- WIRE 3 TO 4 -->
  <path d="M 880 250 L 940 250" stroke="url(#flowGrad)" stroke-width="3" stroke-dasharray="6 4" filter="url(#glow)" />

  <!-- STAGE 4: ACTIONABLE DELIVERABLES -->
  <g transform="translate(940, 110)">
    <rect width="200" height="280" rx="14" fill="url(#evalCardGrad)" stroke="#374151" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="38" rx="14" fill="#1A2234" />
    <text x="16" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#34D399">04 DELIVERABLES</text>

    <g transform="translate(14, 56)">
      <rect width="172" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="10" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">JSON &amp; CSV Exports</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#6B7280">Machine-readable logs</text>
    </g>

    <g transform="translate(14, 108)">
      <rect width="172" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="10" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Hallucination Index</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#EF4444">Root cause taxonomy</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="172" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <text x="10" y="20" font-family="'Schibsted Grotesk', system-ui, sans-serif" font-size="11" font-weight="600" fill="#F3F4F6">Remediation Guide</text>
      <text x="10" y="34" font-family="ui-monospace, monospace" font-size="9" fill="#10B981">Concrete prompt fixes</text>
    </g>

    <g transform="translate(14, 218)">
      <rect width="172" height="42" rx="6" fill="#064E3B" fill-opacity="0.4" stroke="#10B981" stroke-width="1" />
      <text x="10" y="25" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#34D399">48-Hour Turnaround</text>
    </g>
  </g>
</svg>
