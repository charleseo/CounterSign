.p-ruler{position:absolute;left:-10px;right:-10px;top:0;height:33.34%;border-radius:6px;background:rgba(90,53,200,.07);-webkit-backdrop-filter:saturate(170%) brightness(1.04);backdrop-filter:saturate(170%) brightness(1.04);border-top:1.5px solid rgba(90,53,200,.55);border-bottom:1.5px solid rgba(90,53,200,.55);pointer-events:none;animation:p-ruler 1.7s cubic-bezier(.65,0,.25,1) .7s both}
@keyframes p-ruler{0%{top:0;opacity:0}10%{top:0;opacity:1}25%{top:0}40%{top:33.33%}55%{top:33.33%}70%{top:66.66%}90%{top:66.66%;opacity:1}100%{top:66.66%;opacity:0}}
